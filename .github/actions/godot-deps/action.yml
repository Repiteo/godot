name: Setup uv, Python, and SCons
description: Setup Python via uv, install the pip version of SCons.

inputs:
  python-version:
    description: The Python version to use.
    default: ""
  python-arch:
    description: The uv/Python architecture.
    default: ""
  resolution:
    description: Resolution strategy when resolving version ranges (`highest` or `lowest`).
    default: highest

runs:
  using: composite
  steps:
    - name: Set up Python 3.x with uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ inputs.python-version }}
        python-arch: ${{ inputs.python-arch }}
        # resolution-strategy: ${{ inputs.resolution }}

    - name: Set up project dependencies
      shell: bash
      env:
        # UV_SYSTEM_PYTHON: 1
        # UV_BREAK_SYSTEM_PACKAGES: 1
        # Workaround no lower bound for `setup-tools` in SCons < 4.7.
        RESOLUTION: ${{ inputs.resolution == 'highest' && 'highest' || 'lowest-direct' }}
      run: |
        python --version
        uv python install --default
        python --version
        uv pip install -r pyproject.toml --resolution=${{ env.RESOLUTION }}
        scons --version

    - name: Setup problem matchers
      shell: bash
      run: echo ::add-matcher::misc/utility/problem-matchers.json
